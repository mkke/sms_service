[start]
command:/usr/sbin/service sms_service start
parameters:
type:script
message:Starting the SMS gateway

[stop]
command:/usr/sbin/service sms_service stop
parameters:
type:script
message:Stopping the SMS gateway

[restart]
command:/usr/sbin/service sms_service restart
parameters:
type:script
message:Restarting the SMS gateway

[status]
command:/usr/sbin/service sms_service status
parameters:
type:script_output
errors:no
message:Requesting the SMS gateway status
